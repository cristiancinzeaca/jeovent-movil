<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a4fa0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jeovent · Material por presupuesto</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--azul:#1a4fa0;--azul2:#2563eb;--txt:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#065f46;--okbg:#ecfdf5;--warn:#92400e;--warnbg:#fffbeb;--err:#991b1b;--errbg:#fef2f2}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;background:#eef2f7;color:var(--txt);font-size:15px}
  .top{background:linear-gradient(160deg,#0f1f3d 0%,#1a4fa0 70%,#2563eb 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  .top h1{margin:0;font-size:18px;font-weight:700}
  .top a{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px}
  .top .who{font-size:12px;color:rgba(255,255,255,.75)}
  .wrap{max-width:560px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 30px)}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 span{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--txt);outline:none}
  input:focus{border-color:var(--azul2)}
  .g2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#e2e8f0;color:var(--txt)}
  .btn.p{background:var(--azul);color:#fff}
  .btn.w{width:100%;margin-top:10px}
  .btn.s{padding:7px 11px;font-size:13px;font-weight:500}
  .btn:disabled{opacity:.5}
  .msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;line-height:1.4}
  .msg.warn{background:var(--warnbg);color:var(--warn)}
  .msg.err{background:var(--errbg);color:var(--err)}
  .espera{text-align:center;padding:26px 10px}
  .espera .sp{width:38px;height:38px;border:4px solid #cbd5e1;border-top-color:var(--azul);border-radius:50%;margin:0 auto 14px;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .espera p{margin:4px 0;color:var(--muted);font-size:13px}
  .espera h3{margin:0 0 6px;font-size:16px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .kpi b{display:block;font-size:19px;color:var(--azul)}
  .kpi span{font-size:11px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  td.n,th.n{text-align:right;white-space:nowrap}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  tr.perfil{cursor:pointer}
  tr.perfil.open td{background:#eff6ff}
  .det{background:#f8fafc;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;margin:0 0 6px}
  .det b{display:block;margin-bottom:2px}
  .det .resto{color:var(--muted)}
  .tot{font-size:13px;line-height:1.7;padding:6px 0}
  .tot b{color:var(--azul)}
  .lista .it{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .lista .it:last-child{border-bottom:none}
  .lista .it .e{font-size:11px;padding:3px 8px;border-radius:999px;background:#e2e8f0;white-space:nowrap}
  .lista .it .e.listo{background:var(--okbg);color:var(--ok)} .lista .it .e.error{background:var(--errbg);color:var(--err)}
  .pc{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
  .pc.mal{color:var(--err)}
  .abierta{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#dbeafe;color:#1e3a8a;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
  .abierta .btn{padding:7px 12px;font-size:13px;background:#fff;color:var(--azul)}
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:99;max-width:90vw}
</style>

<style>/* JEOVENT-MOBILE-CSS */
@media (max-width: 768px) {
  body { font-size: 14px; }
  .table-wrap, .table-wrap-x { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
  table { min-width: 800px; }
  .toolbar, .subnav { flex-wrap: wrap; gap: 6px; padding: 8px; }
  .modal { width: 96vw !important; max-width: 96vw !important; max-height: 92vh !important; }
  .modal-wide { width: 96vw !important; max-width: 96vw !important; }
  .btn { padding: 10px 14px; font-size: 14px; min-height: 38px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 32px; }
  input, select, textarea { font-size: 16px !important; min-height: 38px; }
  .form-grid { grid-template-columns: 1fr !important; }
  .stat-cards { overflow-x: auto; padding: 8px; }
  .stat-card { min-width: 120px; }
  /* hide sidebar / detail panels on mobile */
  .csp-side, .client-detail-side { display: none; }
}
@media (max-width: 480px) {
  .nav-btn, .subnav button { font-size: 12px; padding: 6px 8px; }
  h1, h2 { font-size: 16px; }
}
</style>
</head>
<body>
<div class="top">
  <div><h1>🪚 Material por presupuesto</h1><div class="who" id="who"></div></div>
  <a href="app-mobile.html">◀ Menú</a>
</div>
<div class="wrap">
  <div class="pc" id="pc"></div>
  <div id="app"></div>
  <div class="card lista" id="mis" style="display:none"><h2>Mis cálculos <span id="mis-n"></span></h2><div id="mis-l"></div></div>
</div>
<div id="toast"></div>

<script>
/* ===== CONFIG (mismo proyecto Supabase que el PWA) ===== */
var SB_URL = 'https://jcznbhisnbbszlicsnjt.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjem5iaGlzbmJic3psaWNzbmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjY1ODcsImV4cCI6MjA5MTQwMjU4N30.jnWZ5UGqqbO05YT-Xl1uiGjuKl3wAb4JPPHQa841xPM';
var KEY_ACTUAL = 'mat_movil_actual';
var ESTADO_TXT = { pendiente: 'esperando al PC', calculando: 'calculando', listo: 'listo', error: 'error' };

var user = null;
var S = { sol: null, worker: null, numero: '', version: '1', enviando: false, poll: null, mis: [], abierto: {}, otros: false };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt(n, d) { return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
function mm(n) { return fmt(n, 0); }
function toast(m, ms) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2600); }
function hace(iso) { if (!iso) return '–'; var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000); return s < 60 ? s + ' s' : s < 3600 ? Math.round(s / 60) + ' min' : Math.round(s / 3600) + ' h'; }
function fecha(iso) { var d = new Date(iso); return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
function guardarActual(id) { try { if (id) localStorage.setItem(KEY_ACTUAL, id); else localStorage.removeItem(KEY_ACTUAL); } catch (e) {} }

function sb(method, ruta, body, prefer) {
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (prefer || method !== 'GET') h.Prefer = prefer || 'return=representation';
  return fetch(SB_URL + '/rest/v1/' + ruta, { method: method, headers: h, body: body == null ? undefined : JSON.stringify(body) }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('Supabase HTTP ' + r.status + ': ' + t.slice(0, 200)); });
    return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
  });
}

/* ===== flujo ===== */
async function pedir() {
  var n = parseInt(S.numero, 10), v = parseInt(S.version, 10) || 1;
  if (!n) { toast('Escribe el número del presupuesto'); return; }
  if (S.enviando) return;
  S.enviando = true; render();
  try {
    var fila = await sb('POST', 'mat_solicitudes', { usuario: user.username, numero: n, version: v, estado: 'pendiente' });
    S.sol = fila[0]; guardarActual(S.sol.id); S.abierto = {}; S.otros = false;
  } catch (e) { toast(e.message, 5000); }
  S.enviando = false; render(); poll();
}
function cargar(sol) { var cambia = !S.sol || S.sol.id !== sol.id || S.sol.estado !== sol.estado; S.sol = sol; guardarActual(sol.id); if (cambia) { S.abierto = {}; render(); } }
function nuevo() { S.sol = null; guardarActual(null); render(); }

async function poll() {
  clearTimeout(S.poll);
  try {
    var w = await sb('GET', 'pres_worker?id=eq.1&select=visto,pc,pendientes');
    if (w && w[0]) S.worker = w[0];
    if (S.sol) {
      var r = await sb('GET', 'mat_solicitudes?id=eq.' + S.sol.id + '&select=*');
      if (r && r[0]) { var antes = S.sol.estado; cargar(r[0]); if (antes !== r[0].estado && r[0].estado === 'listo') toast('Material calculado ✓'); }
    }
    var m = await sb('GET', 'mat_solicitudes?usuario=eq.' + encodeURIComponent(user.username) + '&order=created_at.desc&limit=12&select=id,created_at,estado,numero,version,resultado->cliente,resultado->totales');
    S.mis = m || [];
  } catch (e) { $('pc').textContent = '⚠ ' + e.message; $('pc').className = 'pc mal'; }
  pintarPc(); pintarMis();
  var activo = S.sol && /^(pendiente|calculando)$/.test(S.sol.estado);
  S.poll = setTimeout(poll, activo ? 3000 : 20000);
}
function pintarPc() {
  var el = $('pc'); if (!S.worker) { el.textContent = 'Sin noticias del PC del taller'; el.className = 'pc mal'; return; }
  var seg = (Date.now() - new Date(S.worker.visto).getTime()) / 1000, mal = seg > 90;
  el.className = 'pc' + (mal ? ' mal' : '');
  el.textContent = mal ? '⚠ El PC del taller (' + (S.worker.pc || '?') + ') no responde desde hace ' + hace(S.worker.visto) + '. Los cálculos quedan en cola hasta que vuelva Jeovent Taller.' : '🖥 PC del taller atendiendo · visto hace ' + hace(S.worker.visto);
}
function pintarMis() {
  var box = $('mis'); if (!S.mis.length) { box.style.display = 'none'; return; }
  box.style.display = 'block'; $('mis-n').textContent = S.mis.length + ' últimos';
  $('mis-l').innerHTML = S.mis.map(function (s) {
    var t = s.estado === 'listo' && s.totales ? s.totales.barras + ' barras · ' + fmt(s.totales.ml_perfiles, 0) + ' ml' : (ESTADO_TXT[s.estado] || s.estado);
    return '<div class="it" data-id="' + s.id + '"><div><b>' + s.numero + '/' + s.version + '</b> <span style="color:var(--muted)">' + esc(s.cliente || '') + '</span><br><small style="color:var(--muted)">' + fecha(s.created_at) + '</small></div><span class="e ' + esc(s.estado) + '">' + esc(t) + '</span></div>';
  }).join('');
  $('mis-l').querySelectorAll('.it').forEach(function (el) { el.onclick = function () { sb('GET', 'mat_solicitudes?id=eq.' + el.dataset.id + '&select=*').then(function (r) { if (r && r[0]) { S.sol = null; cargar(r[0]); window.scrollTo(0, 0); } }); }; });
}

/* ===== render ===== */
function cardPedir() {
  return '<div class="card"><h2>¿Qué presupuesto? <span>el PC del taller lee PrefGest y calcula</span></h2>' +
    '<div class="g2"><div><label>Número</label><input id="num" inputmode="numeric" value="' + esc(S.numero) + '" placeholder="8419"></div><div><label>Versión</label><input id="ver" inputmode="numeric" value="' + esc(S.version) + '"></div></div>' +
    '<button class="btn p w" id="pedir" ' + (S.enviando ? 'disabled' : '') + '>' + (S.enviando ? 'Enviando…' : 'Calcular material') + '</button>' +
    '<p style="font-size:12px;color:var(--muted);margin:10px 0 0">Perfiles en barras (piezas de PrefGest, barras optimizadas), lamas de persiana (largo = ancho − 75; lamas = (alto + cajón) ÷ 45 hacia abajo + 2; barras de 6 m, paquetes de 60) y otros materiales.</p></div>';
}
function resultado(R) {
  var l = R.lamas, t = R.totales, h = '';
  h += '<div class="kpis">' +
    '<div class="kpi"><b>' + R.numero + '/' + R.version + '</b><span>' + esc(R.cliente || '') + (R.obra ? ' · ' + esc(R.obra) : '') + '</span></div>' +
    '<div class="kpi"><b>' + t.posiciones + ' / ' + t.unidades + '</b><span>posiciones / unidades</span></div>' +
    '<div class="kpi"><b>' + t.barras + '</b><span>barras de perfil · ' + fmt(t.ml_perfiles, 0) + ' ml</span></div>' +
    '<div class="kpi"><b>' + l.lamas + '</b><span>lamas · ' + l.barras + ' barras · ' + fmt(l.paquetes, 2) + ' paq.</span></div></div>';
  h += '<div class="card"><h2>Perfiles <span>toca una fila: piezas y plan de corte</span></h2><table><thead><tr><th>Ref.</th><th class="n">Barra</th><th class="n">ml</th><th class="n">Barras</th></tr></thead><tbody>' +
    R.perfiles.map(function (p) {
      var open = !!S.abierto[p.ref];
      var row = '<tr class="perfil' + (open ? ' open' : '') + '" data-ref="' + esc(p.ref) + '"><td><span class="mono">' + esc(p.ref) + '</span><br><small style="color:var(--muted)">' + esc(p.descripcion) + '</small></td><td class="n">' + mm(p.barra) + (p.barra_supuesta ? '?' : '') + '</td><td class="n">' + fmt(p.ml, 1) + '</td><td class="n"><b>' + p.barras + '</b></td></tr>';
      if (open) row += '<tr><td colspan="4"><div class="det"><b>Piezas por largo (' + p.n_piezas + ')</b>' + p.piezas.map(function (z) { return mm(z.largo) + ' × ' + z.n; }).join(' · ') + '</div>' +
        '<div class="det"><b>Plan de corte · ' + p.cortes.length + ' barras · mínimo ' + p.minimo + ' · desperdicio ' + fmt(p.desperdicio_pct, 1) + ' %</b>' + p.cortes.map(function (b, i) { return '<div><span class="mono">' + (i + 1) + '.</span> ' + b.piezas.map(mm).join(' + ') + ' <span class="resto">resto ' + mm(b.resto) + '</span></div>'; }).join('') + '</div></td></tr>';
      return row;
    }).join('') + '</tbody></table></div>';
  h += '<div class="card"><h2>Lamas de persiana <span>ancho − ' + l.cfg.descuento + ' · (alto + cajón) ÷ ' + l.cfg.paso + ' + ' + l.cfg.extra + '</span></h2>' +
    '<table><thead><tr><th>Pos.</th><th class="n">Ventana</th><th class="n">Lama</th><th class="n">Lamas</th></tr></thead><tbody>' +
    l.detalle.map(function (d) { return '<tr><td>' + d.n + '</td><td class="n">' + mm(d.ancho_mm) + '×' + mm(d.alto_mm) + '+' + d.cajon_mm + ' ×' + d.uds + '</td><td class="n mono">' + mm(d.largo) + '</td><td class="n"><b>' + d.lamas + '</b> <small style="color:var(--muted)">(' + d.lamas_ud + '/ud)</small></td></tr>'; }).join('') +
    '</tbody></table>' +
    '<div class="tot"><b>' + l.lamas + '</b> lamas · <b>' + fmt(l.ml, 1) + '</b> ml<br><b>' + l.barras + '</b> barras de 6 m optimizando el corte (por metros ' + fmt(l.barras_por_ml, 1) + ') · desperdicio ' + fmt(l.desperdicio_pct, 1) + ' %<br><b>' + fmt(l.paquetes, 2) + '</b> paquetes de 60 → <b>' + Math.ceil(l.paquetes) + '</b> paquetes<br>Cortando cada largo solo de sus barras: <b>' + l.porLargo.reduce(function (s, g) { return s + g.barras_solo; }, 0) + '</b> barras</div>' +
    '<table><thead><tr><th class="n">Largo</th><th class="n">Lamas</th><th class="n">Por barra</th><th class="n">Barras</th></tr></thead><tbody>' +
    l.porLargo.map(function (g) { return '<tr><td class="n mono">' + mm(g.largo) + '</td><td class="n">' + g.n + '</td><td class="n">' + g.por_barra + '</td><td class="n">' + g.barras_solo + '</td></tr>'; }).join('') + '</tbody></table></div>';
  h += '<div class="card"><h2>Otros materiales <span>' + R.otros.length + ' referencias</span><button class="btn s" id="otros">' + (S.otros ? 'Ocultar' : 'Ver') + '</button></h2>' +
    (S.otros ? '<table><thead><tr><th>Ref.</th><th class="n">Cant.</th></tr></thead><tbody>' + R.otros.map(function (o) { return '<tr><td><span class="mono">' + esc(o.ref) + '</span><br><small style="color:var(--muted)">' + esc(o.descripcion) + '</small></td><td class="n">' + fmt(o.cantidad, 0) + (o.ml ? '<br><small>' + fmt(o.ml, 1) + ' ml</small>' : '') + '</td></tr>'; }).join('') + '</tbody></table>' : '') + '</div>';
  h += '<div class="g2" style="grid-template-columns:1fr 1fr"><button class="btn" id="compartir">Compartir resumen</button><button class="btn" id="nuevo">Otro presupuesto</button></div>';
  return h;
}
function render() {
  var sol = S.sol, h = '';
  if (sol) h += '<div class="abierta"><span>' + sol.numero + '/' + sol.version + ' · ' + (ESTADO_TXT[sol.estado] || sol.estado) + ' · ' + fecha(sol.created_at) + '</span><button class="btn s" id="nuevo-top">＋ Otro</button></div>';
  if (!sol) h += cardPedir();
  else if (/^(pendiente|calculando)$/.test(sol.estado)) h += '<div class="card espera"><div class="sp"></div><h3>' + (sol.estado === 'pendiente' ? 'Esperando al PC del taller…' : 'Calculando el material…') + '</h3><p>Presupuesto ' + sol.numero + '/' + sol.version + ' · enviado hace ' + hace(sol.created_at) + '</p><p>Suele tardar unos segundos.</p></div>';
  else if (sol.estado === 'listo' && sol.resultado) h += resultado(sol.resultado);
  else if (sol.estado === 'error') h += '<div class="card"><h2>No se ha podido</h2><div class="msg err">' + esc(sol.error || 'Error desconocido') + '</div><button class="btn w" id="nuevo">Otro presupuesto</button></div>';
  $('app').innerHTML = h;
  var b;
  if ((b = $('num'))) b.oninput = function () { S.numero = this.value; };
  if ((b = $('ver'))) b.oninput = function () { S.version = this.value; };
  if ((b = $('pedir'))) b.onclick = pedir;
  if ((b = $('nuevo'))) b.onclick = nuevo;
  if ((b = $('nuevo-top'))) b.onclick = nuevo;
  if ((b = $('otros'))) b.onclick = function () { S.otros = !S.otros; render(); };
  document.querySelectorAll('tr.perfil').forEach(function (tr) { tr.onclick = function () { S.abierto[tr.dataset.ref] = !S.abierto[tr.dataset.ref]; render(); }; });
  if ((b = $('compartir'))) b.onclick = function () {
    var R = S.sol.resultado, l = R.lamas;
    var txt = 'Material presupuesto ' + R.numero + '/' + R.version + ' ' + (R.cliente || '') + '\n' + R.perfiles.map(function (p) { return p.ref + ': ' + p.barras + ' barras de ' + mm(p.barra) + ' (' + fmt(p.ml, 1) + ' ml)'; }).join('\n') + '\nLamas: ' + l.lamas + ' uds, ' + l.barras + ' barras de 6 m, ' + fmt(l.paquetes, 2) + ' paquetes';
    if (navigator.share) navigator.share({ title: 'Material ' + R.numero + '/' + R.version, text: txt }).catch(function () {});
    else window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
  };
}

(function () {
  try { user = JSON.parse(localStorage.getItem('jeovent_user') || 'null'); } catch (e) {}
  if (!user || !user.username) { $('app').innerHTML = '<div class="card"><h2>Inicia sesión</h2><p style="color:var(--muted);font-size:14px">Entra primero en la app Jeovent y vuelve a esta pantalla.</p><a class="btn p w" href="app-mobile.html">Ir a iniciar sesión</a></div>'; return; }
  $('who').textContent = user.nombre || user.username;
  var actual = null; try { actual = localStorage.getItem(KEY_ACTUAL); } catch (e) {}
  render();
