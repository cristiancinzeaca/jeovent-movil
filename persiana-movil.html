<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a4fa0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jeovent · Precio de persiana</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--azul:#1a4fa0;--azul2:#2563eb;--txt:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#065f46;--okbg:#ecfdf5;--warn:#92400e;--warnbg:#fffbeb;--err:#991b1b;--errbg:#fef2f2}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;background:#eef2f7;color:var(--txt);font-size:15px}
  .top{background:linear-gradient(160deg,#0f1f3d 0%,#1a4fa0 70%,#2563eb 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top h1{margin:0;font-size:18px;font-weight:700}
  .top a{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px}
  .top .who{font-size:12px;color:rgba(255,255,255,.75)}
  .wrap{max-width:560px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 30px)}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .card h2{margin:0 0 6px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 span{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--txt);outline:none}
  input:focus,select:focus{border-color:var(--azul2)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt);margin-top:10px}
  .chk input{width:20px;height:20px;margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#e2e8f0;color:var(--txt)}
  .btn.p{background:var(--azul);color:#fff}
  .btn.w{width:100%;margin-top:10px}
  .msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;line-height:1.4}
  .msg.warn{background:var(--warnbg);color:var(--warn)}
  .msg.err{background:var(--errbg);color:var(--err)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .kpi b{display:block;font-size:21px;color:var(--azul)}
  .kpi span{font-size:11px;color:var(--muted)}
  .kpi.v b{color:var(--ok)}
  .kpi input{display:inline-block;width:58px;padding:2px 6px;font-size:13px;margin-left:4px;border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  td.n,th.n{text-align:right;white-space:nowrap}
  td small{display:block;color:var(--muted);font-size:11px}
  tr.falta td{color:var(--err)}
  tr.grupo td{background:#f8fafc;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .pc{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
  .pc.mal{color:var(--err)}
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:99;max-width:90vw}
</style>

<style>/* JEOVENT-MOBILE-CSS */
@media (max-width: 768px) {
  body { font-size: 14px; }
  .table-wrap, .table-wrap-x { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
  table { min-width: 800px; }
  .toolbar, .subnav { flex-wrap: wrap; gap: 6px; padding: 8px; }
  .modal { width: 96vw !important; max-width: 96vw !important; max-height: 92vh !important; }
  .modal-wide { width: 96vw !important; max-width: 96vw !important; }
  .btn { padding: 10px 14px; font-size: 14px; min-height: 38px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 32px; }
  input, select, textarea { font-size: 16px !important; min-height: 38px; }
  .form-grid { grid-template-columns: 1fr !important; }
  .stat-cards { overflow-x: auto; padding: 8px; }
  .stat-card { min-width: 120px; }
  /* hide sidebar / detail panels on mobile */
  .csp-side, .client-detail-side { display: none; }
}
@media (max-width: 480px) {
  .nav-btn, .subnav button { font-size: 12px; padding: 6px 8px; }
  h1, h2 { font-size: 16px; }
}
</style>
</head>
<body>
<div class="top">
  <div><h1>🎚 Precio de persiana</h1><div class="who" id="who"></div></div>
  <a href="app-mobile.html">◀ Menú</a>
</div>
<div class="wrap">
  <div class="pc" id="pc"></div>
  <div id="app"></div>
</div>
<div id="toast"></div>
<script src="persiana.js"></script>
<script>
/* ===== config ===== */
var SB_URL = 'https://jcznbhisnbbszlicsnjt.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjem5iaGlzbmJic3psaWNzbmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjY1ODcsImV4cCI6MjA5MTQwMjU4N30.jnWZ5UGqqbO05YT-Xl1uiGjuKl3wAb4JPPHQa841xPM';
var KEY_PRECIOS = 'precios_viuda', KEY_ENTRADA = 'persiana_entrada';
var S = { precios: null, info: null, entrada: { ancho_mm: '', alto_mm: '', cajon_mm: 155, uds: 1, color_lama: 'BLANCO', color_terminal: '', cajon: 'blanco', color_cajon: 'GRIS 1605', eje: 0, recogedor: true }, margen_pct: 0, error: '' };
var user = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt(n, d) { return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
function eur(n) { return fmt(n, 2) + ' €'; }
function toast(m, ms) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2500); }
function guardar() { try { localStorage.setItem(KEY_ENTRADA, JSON.stringify({ entrada: S.entrada, margen_pct: S.margen_pct })); } catch (e) {} }
function sb(method, ruta, body, prefer) {
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (prefer || method !== 'GET') h.Prefer = prefer || 'return=representation';
  return fetch(SB_URL + '/rest/v1/' + ruta, { method: method, headers: h, body: body == null ? undefined : JSON.stringify(body) }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('Supabase HTTP ' + r.status + ': ' + t.slice(0, 200)); });
    return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
  });
}

/* ===== precios: tabla "precios" (clave viuda), subida por Jeovent Taller; copia en el teléfono para cuando no hay red ===== */
function cargarPrecios() {
  try { var g = JSON.parse(localStorage.getItem(KEY_PRECIOS) || 'null'); if (g && g.datos) { S.precios = g.datos; S.info = g; } } catch (e) {}
  render();
  sb('GET', 'precios?clave=eq.viuda&select=datos,n,fecha_csv,origen,updated_at').then(function (r) {
    if (r && r[0] && r[0].datos) { S.precios = r[0].datos; S.info = r[0]; S.error = ''; try { localStorage.setItem(KEY_PRECIOS, JSON.stringify(r[0])); } catch (e) {} }
    else if (!S.precios) S.error = 'Todavía no hay precios en la nube: abre Jeovent Taller en el PC del taller (sube el CSV de La Viuda solo).';
    render();
  }).catch(function (e) { if (!S.precios) S.error = 'No se han podido leer los precios: ' + e.message; render(); });
}

/* ===== pantalla ===== */
function opts(lista, sel, vacio) { return (vacio ? '<option value=""' + (!sel ? ' selected' : '') + '>' + esc(vacio) + '</option>' : '') + lista.map(function (v) { return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); }
function render() {
  var e = S.entrada, precios = S.precios || [], op = Persiana.opciones(precios);
  var listo = Number(e.ancho_mm) > 0 && Number(e.alto_mm) > 0 && precios.length > 0;
  var r = listo ? Persiana.calcular(e, precios) : null;
  var margen = Number(S.margen_pct) || 0, venta = r ? r.coste_ud * (1 + margen / 100) : 0;
  $('pc').className = 'pc' + (S.error ? ' mal' : '');
  $('pc').textContent = S.error ? S.error : (S.info ? 'Precios La Viuda: ' + (S.info.n || precios.length) + ' artículos · ' + String(S.info.fecha_csv || S.info.updated_at || '').slice(0, 10) : 'Leyendo precios…');
  var h = '<div class="card"><h2>Persiana <span>regla Jeovent · sin guías</span></h2>' +
    '<div class="g2"><div><label>Ancho (mm)</label><input type="number" inputmode="numeric" data-k="ancho_mm" value="' + esc(e.ancho_mm) + '" placeholder="2000"></div><div><label>Alto (mm)</label><input type="number" inputmode="numeric" data-k="alto_mm" value="' + esc(e.alto_mm) + '" placeholder="1200"></div></div>' +
    '<div class="g3"><div><label>Cajón</label><select data-k="cajon_mm">' + opts(op.cajones, e.cajon_mm) + '</select></div><div><label>Eje</label><select data-k="eje"><option value="0"' + (!Number(e.eje) ? ' selected' : '') + '>auto</option><option value="40"' + (Number(e.eje) === 40 ? ' selected' : '') + '>40</option><option value="60"' + (Number(e.eje) === 60 ? ' selected' : '') + '>60</option></select></div><div><label>Uds</label><input type="number" inputmode="numeric" data-k="uds" value="' + esc(e.uds || 1) + '"></div></div>' +
    '<div class="g2"><div><label>Lama</label><select data-k="color_lama">' + opts(op.colores_lama, e.color_lama) + '</select></div><div><label>Terminal</label><select data-k="color_terminal">' + opts(op.colores_terminal, e.color_terminal, 'como la lama') + '</select></div></div>' +
    '<div class="g2"><div><label>Cajón</label><select data-k="cajon"><option value="blanco"' + (e.cajon !== 'foliado' ? ' selected' : '') + '>blanco (RTX)</option><option value="foliado"' + (e.cajon === 'foliado' ? ' selected' : '') + '>foliado</option></select></div>' +
    (e.cajon === 'foliado' ? '<div><label>Folio</label><select data-k="color_cajon">' + opts(op.colores_cajon, e.color_cajon) + '</select></div>' : '<div></div>') + '</div>' +
    '<label class="chk"><input type="checkbox" data-k="recogedor"' + (e.recogedor !== false ? ' checked' : '') + '> Con recogedor</label>' +
    '</div>';
  if (r) {
    h += '<div class="kpis"><div class="kpi"><b>' + eur(r.coste_ud) + '</b><span>coste de compra por persiana' + (r.uds > 1 ? ' · ' + r.uds + ' uds: ' + eur(r.coste) : '') + '</span></div>' +
      '<div class="kpi v"><b>' + eur(venta) + '</b><span>venta con margen <input type="number" inputmode="numeric" id="margen" value="' + esc(S.margen_pct) + '"> %</span></div>' +
      '<div class="kpi"><b>' + r.lamas.n + ' × ' + fmt(r.lamas.largo_mm, 0) + '</b><span>lamas (' + fmt(r.lamas.ml, 2) + ' ml) · eje ' + r.eje + '</span></div>' +
      '<div class="kpi"><b>' + (r.faltan.length ? '⚠ ' + r.faltan.length : '✓') + '</b><span>' + (r.faltan.length ? 'piezas sin precio' : 'todas las piezas con precio') + '</span></div></div>';
    var grupos = []; r.piezas.forEach(function (p) { if (grupos.indexOf(p.grupo) < 0) grupos.push(p.grupo); });
    h += '<div class="card"><h2>Piezas <span>por persiana · último precio</span></h2><table><thead><tr><th>Pieza</th><th class="n">Cant.</th><th class="n">€</th></tr></thead><tbody>';
    grupos.forEach(function (g) {
      h += '<tr class="grupo"><td colspan="3">' + esc(g) + '</td></tr>';
      r.piezas.filter(function (p) { return p.grupo === g; }).forEach(function (p) {
        h += '<tr' + (p.falta ? ' class="falta"' : '') + '><td>' + esc(p.descripcion) + '<small>' + esc(p.formula) + (p.precio ? ' · ' + fmt(p.precio, 3) + ' €/' + esc(p.unidad || 'ud') : '') + '</small></td><td class="n">' + fmt(p.cantidad, p.unidad === 'ML' ? 3 : 0) + ' ' + esc(p.unidad) + '</td><td class="n"><b>' + eur(p.importe_ud) + '</b></td></tr>';
      });
    });
    h += '<tr><td><b>Coste por persiana (sin IVA)</b></td><td></td><td class="n"><b>' + eur(r.coste_ud) + '</b></td></tr></tbody></table>' +
      '<button class="btn w" id="compartir">📤 Compartir resumen</button></div>';
  } else if (precios.length) h += '<div class="msg warn">Escribe el ancho y el alto. Las guías van aparte, en el precio de la ventana.</div>';
  $('app').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) {
    el.onchange = el.oninput = function () { var k = el.dataset.k; S.entrada[k] = el.type === 'checkbox' ? el.checked : (k === 'cajon_mm' || k === 'eje' || k === 'uds' ? Number(el.value) : el.value); guardar(); if (el.tagName === 'SELECT' || el.type === 'checkbox') render(); else renderSuave(); };
  });
  var m = $('margen'); if (m) m.onchange = function () { S.margen_pct = Number(m.value) || 0; guardar(); render(); };
  var c = $('compartir'); if (c) c.onclick = function () {
    var txt = 'Persiana ' + e.ancho_mm + ' x ' + e.alto_mm + ' mm, cajón ' + e.cajon_mm + ', lama ' + e.color_lama + (e.cajon === 'foliado' ? ', cajón foliado ' + e.color_cajon : ', cajón blanco') + (r.uds > 1 ? ', ' + r.uds + ' uds' : '') + '\n' +
      'Coste de compra: ' + eur(r.coste_ud) + ' por persiana' + (margen ? ' · venta +' + margen + '%: ' + eur(venta) : '') + '\n' + r.lamas.n + ' lamas de ' + r.lamas.largo_mm + ' mm (' + fmt(r.lamas.ml, 2) + ' ml)\n' +
      r.piezas.map(function (p) { return '· ' + p.descripcion + ': ' + fmt(p.cantidad, p.unidad === 'ML' ? 3 : 0) + ' ' + p.unidad + ' = ' + eur(p.importe_ud); }).join('\n');
    if (navigator.share) navigator.share({ title: 'Precio de persiana', text: txt }).catch(function () {});
    else window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
  };
}
// al teclear ancho/alto no se repinta el formulario (perdería el foco): solo se recalcula al salir del campo
var tRender = null;
function renderSuave() { clearTimeout(tRender); tRender = setTimeout(function () { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render(); }, 400); }
document.addEventListener('focusout', function () { setTimeout(render, 50); });

(function () {
  try { user = JSON.parse(localStorage.getItem('jeovent_user') || 'null'); } catch (e) {}
  if (!user || !user.username) { $('app').innerHTML = '<div class="card"><h2>Inicia sesión</h2><p style="color:var(--muted);font-size:14px">Entra primero en la app Jeovent y vuelve a esta pantalla.</p><a class="btn p w" href="app-mobile.html">Ir al menú</a></div>'; return; }
  $('who').textContent = user.nombre || user.username;
  try { var g = JSON.parse(localStorage.getItem(KEY_ENTRADA) || 'null'); if (g && g.entrada) { S.entrada = Object.assign(S.entrada, g.entrada); S.margen_pct = Number(g.margen_pct) || 0; } } catch (e) {}
  cargarPrecios();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) cargarPrecios(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(function () {});
})();
</script>
</body>
</html>
