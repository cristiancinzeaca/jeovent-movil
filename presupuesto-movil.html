<!DOCTYPE html>
<html lang="es">
<head>

<title>Jeovent · Presupuesto rápido</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--azul:#1a4fa0;--azul2:#2563eb;--txt:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#065f46;--okbg:#ecfdf5;--warn:#92400e;--warnbg:#fffbeb;--err:#991b1b;--errbg:#fef2f2}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;background:#eef2f7;color:var(--txt);font-size:15px}
  .top{background:linear-gradient(160deg,#0f1f3d 0%,#1a4fa0 70%,#2563eb 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  .top h1{margin:0;font-size:18px;font-weight:700}
  .top a{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px}
  .top .who{font-size:12px;color:rgba(255,255,255,.75)}
  .wrap{max-width:560px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 90px)}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 span{font-weight:400;color:var(--muted);font-size:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--txt);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--azul2)}
  input[type=checkbox]{width:auto;transform:scale(1.2);margin-right:6px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#e2e8f0;color:var(--txt)}
  .btn.p{background:var(--azul);color:#fff}
  .btn.w{width:100%;margin-top:10px}
  .btn.s{padding:7px 11px;font-size:13px;font-weight:500}
  .btn.d{background:var(--errbg);color:var(--err)}
  .btn:disabled{opacity:.5}
  .btn:active{transform:scale(.98)}
  .fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .fotos .f{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .fotos .f img{width:100%;height:100%;object-fit:cover}
  .fotos .f b{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px}
  .camara{border:2px dashed #94a3b8;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;background:#f8fafc}
  .camara b{display:block;font-size:28px;margin-bottom:4px}
  .msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;line-height:1.4}
  .msg.ok{background:var(--okbg);color:var(--ok)}
  .msg.warn{background:var(--warnbg);color:var(--warn)}
  .msg.err{background:var(--errbg);color:var(--err)}
  .espera{text-align:center;padding:26px 10px}
  .espera .sp{width:38px;height:38px;border:4px solid #cbd5e1;border-top-color:var(--azul);border-radius:50%;margin:0 auto 14px;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .espera p{margin:4px 0;color:var(--muted);font-size:13px}
  .espera h3{margin:0 0 6px;font-size:16px}
  .vent{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fafbfd}
  .vent .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .vent .h b{font-size:15px}
  .vent .h small{color:var(--muted);font-size:12px}
  .vent .nota{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}
  .vent .baja{color:var(--warn);font-weight:600}
  .chk{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--txt);margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  td.n,th.n{text-align:right;white-space:nowrap}
  .total{font-size:22px;font-weight:700;color:var(--azul);margin:6px 0}
  .lista .it{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .lista .it:last-child{border-bottom:none}
  .lista .it .e{font-size:11px;padding:3px 8px;border-radius:999px;background:#e2e8f0;white-space:nowrap}
  .lista .it .e.creado{background:var(--okbg);color:var(--ok)} .lista .it .e.error{background:var(--errbg);color:var(--err)} .lista .it .e.leida{background:#dbeafe;color:#1e3a8a}
  .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:none;z-index:5}
  .barra .btn{width:100%}
  .pc{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
  .pc.mal{color:var(--err)}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:9;max-width:90vw}
</style>

<style>/* JEOVENT-MOBILE-CSS */

  body { font-size: 14px; }
  .table-wrap, .table-wrap-x { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
  table { min-width: 800px; }

  input, select, textarea { font-size: 16px !important; min-height: 38px; }
  .form-grid { grid-template-columns: 1fr !important; }

}

<div class="top">
  <div><h1>📐 Presupuesto rápido</h1><div class="who" id="who"></div></div>

</div>
<div class="wrap">

</div>
<div class="barra" id="barra"></div>
<div id="toast"></div>

<script src="acabados.js"></script>
<script>
/* ===== CONFIG (mismo proyecto Supabase que el PWA) ===== */
var SB_URL = 'https://jcznbhisnbbszlicsnjt.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjem5iaGlzbmJic3psaWNzbmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjY1ODcsImV4cCI6MjA5MTQwMjU4N30.jnWZ5UGqqbO05YT-Xl1uiGjuKl3wAb4JPPHQa841xPM';
var BUCKET_FOTOS = 'pres-fotos';
var MAX_PX = 1600;           // lado mayor de la foto que se sube (Claude no necesita más)
var KEY_ACTUAL = 'pres_movil_actual';

var TIPOS = { fijo: 'Fijo', '1_hoja_practicable': '1 hoja practicable', '1_hoja_oscilobatiente': '1 hoja oscilobatiente', '2_hojas_1_oscilobatiente': '2 hojas, 1 oscilobatiente', '2_hojas_practicables': '2 hojas practicables', '2_hojas_oscilobatientes': '2 hojas oscilobatientes', corredera: 'Corredera', balconera: 'Balconera', puerta: 'Puerta', otro: 'Otro (poste + panel)' };
var PERSIANA = { ninguna: 'Sin persiana', recogedor: 'Recogedor', motor: 'Motor' };
var LADO = { ninguno: 'Lado: –', izquierda: 'Lado: izquierda', derecha: 'Lado: derecha' };
var CAJONES = [[0, 'Sin cajón'], [15.5, 'Cajón 155'], [18.5, 'Cajón 185'], [20, 'Cajón 200'], [22.5, 'Cajón 225']];
var ESTADO_TXT = { foto: 'esperando al PC', leyendo: 'leyendo la ficha', leida: 'para revisar', crear: 'esperando al PC', creando: 'creando en PrefGest', creado: 'creado', error: 'error' };

/* ===== estado ===== */
var user = null;
var S = { sol: null, cat: null, worker: null, fotos: [], cab: { cliente: '', telefono: '', direccion: '' }, ventanas: [], vidrio: '', color: '', montaje: true, enviando: false, poll: null, mis: [] };

/* ===== utilidades ===== */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function fmt(n) { return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })); }
function toast(m, ms) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2600); }
function hace(iso) { if (!iso) return '–'; var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000); return s < 60 ? s + ' s' : s < 3600 ? Math.round(s / 60) + ' min' : Math.round(s / 3600) + ' h'; }
function fecha(iso) { var d = new Date(iso); return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }

/* ===== Supabase (REST con la clave anon, como el resto del PWA) ===== */
function sb(method, ruta, body, prefer) {
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (prefer || method !== 'GET') h.Prefer = prefer || 'return=representation';
  return fetch(SB_URL + '/rest/v1/' + ruta, { method: method, headers: h, body: body == null ? undefined : JSON.stringify(body) }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('Supabase HTTP ' + r.status + ': ' + t.slice(0, 200)); });
    return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
  });
}
function sbSubir(bucket, ruta, blob, tipo) {
  return fetch(SB_URL + '/storage/v1/object/' + bucket + '/' + ruta.split('/').map(encodeURIComponent).join('/'), { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': tipo, 'x-upsert': 'true' }, body: blob }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('No se ha podido subir la foto: ' + t.slice(0, 200)); });
  });
}

/* ===== fotos: cámara / galería, reducidas a MAX_PX ===== */
function leerFoto(file) {
  return new Promise(function (ok, ko) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, MAX_PX / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { URL.revokeObjectURL(url); ok({ blob: b, url: c.toDataURL('image/jpeg', 0.6), nombre: file.name || 'foto.jpg' }); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); ko(new Error('No se puede leer la imagen')); };
    img.src = url;
  });
}
function anadirFotos(files) {
  var lista = [].slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
  if (!lista.length) return;
  Promise.all(lista.map(leerFoto)).then(function (fs) { S.fotos = S.fotos.concat(fs); render(); }).catch(function (e) { toast(e.message); });
}

/* ===== flujo ===== */
function guardarActual(id) { try { if (id) localStorage.setItem(KEY_ACTUAL, id); else localStorage.removeItem(KEY_ACTUAL); } catch (e) {} }

async function enviarALeer() {
  if (S.enviando) return;
  if (!S.fotos.length) { toast('Haz una foto de la ficha primero'); return; }
  S.enviando = true; render();
  try {
    var id = uuid(), fotos = [];
    for (var i = 0; i < S.fotos.length; i++) {
      var ruta = id + '/' + (i + 1) + '.jpg';
      await sbSubir(BUCKET_FOTOS, ruta, S.fotos[i].blob, 'image/jpeg');
      fotos.push({ path: ruta, nombre: S.fotos[i].nombre });
    }
    var fila = await sb('POST', 'pres_solicitudes', { id: id, usuario: user.username, cliente: S.cab.cliente || null, telefono: S.cab.telefono || null, direccion: S.cab.direccion || null, estado: 'foto', fotos: fotos });
    S.sol = fila[0]; S.fotos = []; guardarActual(S.sol.id);
    toast('Ficha enviada. El PC del taller la está leyendo…');
  } catch (e) { toast(e.message, 5000); }
  S.enviando = false; render(); poll();
}

// Sin foto: ficha vacía para meter las medidas a mano
async function empezarAMano() {
  try {
    var fila = await sb('POST', 'pres_solicitudes', { id: uuid(), usuario: user.username, cliente: S.cab.cliente || null, telefono: S.cab.telefono || null, direccion: S.cab.direccion || null, estado: 'leida', fotos: [], lectura: { cabecera: {}, ventanas: [], avisos: [], vidrio_auto: '', color_auto: '' } });
    cargarSolicitud(fila[0]);
  } catch (e) { toast(e.message, 5000); }
}

// Al recibir una solicitud (de la lista o del poll): pasa la lectura a la tabla editable
function cargarSolicitud(sol) {
  var cambia = !S.sol || S.sol.id !== sol.id || S.sol.estado !== sol.estado;
  S.sol = sol; guardarActual(sol.id);
  if (cambia && sol.estado === 'leida') {
    var L = sol.lectura || {};
    var cab = L.cabecera || {};
    S.cab = { cliente: sol.cliente || '', telefono: sol.telefono || cab.telefono || '', direccion: sol.direccion || cab.direccion || '' };
    S.cabTexto = { vidrio: cab.vidrio || '', color: cab.color || '' };
    S.ventanas = (sol.datos && sol.datos.ventanas_ui) ? sol.datos.ventanas_ui : (L.ventanas || []).map(function (v) { return Object.assign({}, v); });
    var cat = S.cat || {};
    S.vidrio = (sol.datos && sol.datos.acabado && sol.datos.acabado.vidrio) || L.vidrio_auto || cat.vidrio_defecto || '';
    S.color = (sol.datos && sol.datos.acabado && sol.datos.acabado.color) || L.color_auto || cat.color_defecto || '';
    S.montaje = sol.datos && sol.datos.montaje ? !!sol.datos.montaje.incluir : true;
  }
  render(); poll();
}

function ventanaNueva() { return { ancho_cm: 0, alto_cm: 0, cajon_cm: 0, ancho_tramo1_cm: 0, panel: false, tipo: '1_hoja_oscilobatiente', persiana: 'ninguna', recogedor_lado: 'ninguno', tapajuntas: true, color: '', vidrio: '', uds: 1, estancia: '', notas: '', confianza: 'alta' }; }

function datosParaCrear() {
  var cat = S.cat;
  var ventanas = S.ventanas.map(function (v, i) {
    return { n: i + 1, ancho_mm: Math.round(num(v.ancho_cm) * 10), alto_mm: Math.round(num(v.alto_cm) * 10), cajon_mm: Math.round(num(v.cajon_cm) * 10), l1_mm: Math.round(num(v.ancho_tramo1_cm) * 10), panel: !!v.panel,
      tipo: v.tipo, persiana: v.persiana || 'ninguna', lado: v.recogedor_lado || 'ninguno', uds: Math.max(1, Math.round(num(v.uds) || 1)), tapajuntas: v.tapajuntas !== false, color: v.color || '',
      vidrio: cat ? Acabados.vidrioVentana(cat, v, S.vidrio) : (v.vidrio === 'mate' ? '' : (v.vidrio || '')) };
  }).filter(function (v) { return v.ancho_mm > 0 && v.alto_mm > 0; });
  return { numeracion: 3, cabecera: { cliente: S.cab.cliente, direccion: S.cab.direccion, telefono: S.cab.telefono }, ventanas: ventanas, plantillas: {}, montaje: { incluir: !!S.montaje, importe: 0 },
    acabado: { vidrio: S.vidrio || '', color: S.color || '', vidrio_texto: (S.cabTexto || {}).vidrio || '', color_texto: (S.cabTexto || {}).color || '' }, ventanas_ui: S.ventanas, usuario: user.username };
}

async function crearEnPrefGest() {
  var d = datosParaCrear();
  if (!d.ventanas.length) { toast('No hay ventanas con ancho y alto'); return; }
  if (!confirm('¿Crear un presupuesto NUEVO en PrefGest con ' + d.ventanas.length + ' ventana' + (d.ventanas.length > 1 ? 's' : '') + (S.montaje ? ' + montaje' : '') + '?\nVidrio: ' + (S.vidrio || 'el de la plantilla') + '\nColor: ' + (S.color || 'el de la plantilla') + '\nTarda alrededor de un minuto.')) return;
  try {
    var r = await sb('PATCH', 'pres_solicitudes?id=eq.' + S.sol.id, { estado: 'crear', datos: d, cliente: S.cab.cliente || null, telefono: S.cab.telefono || null, direccion: S.cab.direccion || null, error: null });
    S.sol = r[0]; render(); poll();
  } catch (e) { toast(e.message, 5000); }
}
async function guardarBorrador() {
  if (!S.sol || S.sol.estado !== 'leida') return;
  try { await sb('PATCH', 'pres_solicitudes?id=eq.' + S.sol.id, { datos: datosParaCrear(), cliente: S.cab.cliente || null, telefono: S.cab.telefono || null, direccion: S.cab.direccion || null }, 'return=minimal'); } catch (e) {}
}
async function reintentar() {
  var sol = S.sol; if (!sol) return;
  var a = /^Creaci/.test(sol.error || '') || (sol.datos && sol.datos.ventanas) ? 'crear' : (sol.lectura ? 'leida' : 'foto');
  try { var r = await sb('PATCH', 'pres_solicitudes?id=eq.' + sol.id, { estado: a, error: null }); cargarSolicitud(r[0]); } catch (e) { toast(e.message, 5000); }
}
async function volverAEditar() {
  try { var r = await sb('PATCH', 'pres_solicitudes?id=eq.' + S.sol.id, { estado: 'leida', error: null }); S.sol = null; cargarSolicitud(r[0]); } catch (e) { toast(e.message, 5000); }
}
function nuevaFicha() { S.sol = null; S.fotos = []; S.ventanas = []; S.cab = { cliente: '', telefono: '', direccion: '' }; guardarActual(null); render(); }

/* ===== poll: solicitud actual + latido del PC + catálogo ===== */
async function poll() {
  clearTimeout(S.poll);
  try {
    var w = await sb('GET', 'pres_worker?id=eq.1&select=visto,pc,pendientes,catalogo,plantillas');
    if (w && w[0]) { S.worker = w[0]; if (w[0].catalogo && (!S.cat || S.cat.actualizado !== w[0].catalogo.actualizado)) { S.cat = w[0].catalogo; if (S.sol && S.sol.estado === 'leida') { S.vidrio = S.vidrio || S.cat.vidrio_defecto || ''; S.color = S.color || S.cat.color_defecto || ''; } } }
    if (S.sol) {
      var r = await sb('GET', 'pres_solicitudes?id=eq.' + S.sol.id + '&select=*');
      if (r && r[0]) { var antes = S.sol.estado; cargarSolicitud(r[0]); if (antes !== r[0].estado && r[0].estado === 'creado') toast('Presupuesto ' + r[0].resultado.numero + ' creado ✓', 4000); }
    }
    var m = await sb('GET', 'pres_solicitudes?usuario=eq.' + encodeURIComponent(user.username) + '&order=created_at.desc&limit=15&select=id,created_at,estado,cliente,resultado,pdf_url');
    S.mis = m || [];
  } catch (e) { $('pc').textContent = '⚠ ' + e.message; $('pc').className = 'pc mal'; }
  pintarPc(); pintarMis();
  var activo = S.sol && /^(foto|leyendo|crear|creando)$/.test(S.sol.estado);
  S.poll = setTimeout(poll, activo ? 3000 : 20000);
}
function pintarPc() {
  var el = $('pc'); if (!S.worker) { el.textContent = 'Sin noticias del PC del taller'; el.className = 'pc mal'; return; }
  var seg = (Date.now() - new Date(S.worker.visto).getTime()) / 1000;
  var mal = seg > 90;
  el.className = 'pc' + (mal ? ' mal' : '');
  el.textContent = mal ? '⚠ El PC del taller (' + (S.worker.pc || '?') + ') no responde desde hace ' + hace(S.worker.visto) + '. Las fichas quedan en cola hasta que vuelva Jeovent Taller.' : '🖥 PC del taller atendiendo · visto hace ' + hace(S.worker.visto) + (S.worker.pendientes ? ' · ' + S.worker.pendientes + ' en cola' : '');
}
function pintarMis() {
  var box = $('mis'); if (!S.mis.length) { box.style.display = 'none'; return; }
  box.style.display = 'block'; $('mis-n').textContent = S.mis.length + ' últimas';
  $('mis-l').innerHTML = S.mis.map(function (s) {
    var t = s.estado === 'creado' && s.resultado ? 'Nº ' + s.resultado.numero + ' · ' + fmt(s.resultado.importe) + ' €' : ESTADO_TXT[s.estado] || s.estado;
    return '<div class="it" data-id="' + s.id + '"><div><b>' + esc(s.cliente || 'Sin nombre') + '</b><br><small style="color:var(--muted)">' + fecha(s.created_at) + '</small></div><span class="e ' + esc(s.estado) + '">' + esc(t) + '</span></div>';
  }).join('');
  $('mis-l').querySelectorAll('.it').forEach(function (el) { el.onclick = function () { sb('GET', 'pres_solicitudes?id=eq.' + el.dataset.id + '&select=*').then(function (r) { if (r && r[0]) { S.sol = null; cargarSolicitud(r[0]); window.scrollTo(0, 0); } }); }; });
}

/* ===== render ===== */
function opciones(lista, val, vacio) {
  var h = vacio ? '<option value="">' + esc(vacio) + '</option>' : '';
  return h + lista.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
}
function selVidrio(val, conGeneral) {
  var cat = S.cat, lista = cat ? cat.vidrios.map(function (v) { return [v.ref, v.ref + (v.descripcion && v.descripcion !== v.ref ? ' · ' + v.descripcion : '')]; }) : [];
  var extra = conGeneral ? [['', 'Como el general (' + (S.vidrio || 'plantilla') + ')'], ['mate', 'Mate → ' + ((cat && Acabados.vidrioMate(cat, S.vidrio)) || '?')]] : [['', 'El de la plantilla']];
  if (val && !lista.some(function (o) { return o[0] === val; }) && val !== 'mate') extra.push([val, val]);
  return opciones(extra.concat(lista), val);
}
function selColor(val, conGeneral) {
  var cat = S.cat, lista = cat ? cat.colores.map(function (c) { return [c.nombre, c.nombre]; }) : [];
  var extra = conGeneral ? [['', 'Como el general (' + (S.color || 'plantilla') + ')']] : [['', 'El de la plantilla']];
  if (val && !lista.some(function (o) { return o[0] === val; })) extra.push([val, val]);
  return opciones(extra.concat(lista), val);
}
function cardCabecera(editable) {
  return '<div class="card"><h2>Cliente</h2><div class="g2"><div><label>Nombre</label><input data-cab="cliente" value="' + esc(S.cab.cliente) + '" placeholder="Nombre del cliente"' + (editable ? '' : ' disabled') + '></div><div><label>Teléfono</label><input data-cab="telefono" inputmode="tel" value="' + esc(S.cab.telefono) + '"' + (editable ? '' : ' disabled') + '></div></div><label>Dirección</label><input data-cab="direccion" value="' + esc(S.cab.direccion) + '" placeholder="Calle, número, población"' + (editable ? '' : ' disabled') + '></div>';
}
function render() {
  var app = $('app'), barra = $('barra'); barra.style.display = 'none'; barra.innerHTML = '';
  var sol = S.sol, h = '';
  if (!sol) {
    h += cardCabecera(true);
    h += '<div class="card"><h2>Ficha de medición <span>foto de la hoja, como la lees tú</span></h2>' +
      '<label class="camara" for="foto-in"><b>📷</b>Hacer foto o elegir de la galería<br><small>se puede más de una (ficha larga, segunda hoja)</small></label>' +
      '<input id="foto-in" type="file" accept="image/*" capture="environment" multiple style="display:none">' +
      (S.fotos.length ? '<div class="fotos">' + S.fotos.map(function (f, i) { return '<div class="f"><img src="' + f.url + '"><b data-quitar="' + i + '">×</b></div>'; }).join('') + '</div>' : '') +
      '<button class="btn p w" id="enviar" ' + (S.enviando || !S.fotos.length ? 'disabled' : '') + '>' + (S.enviando ? 'Subiendo…' : 'Enviar a leer (PC del taller)') + '</button>' +
      '<button class="btn w" id="amano">Sin foto: meter las medidas a mano</button></div>';
  } else if (/^(foto|leyendo)$/.test(sol.estado)) {
    h += '<div class="card espera"><div class="sp"></div><h3>' + (sol.estado === 'foto' ? 'Esperando al PC del taller…' : 'Leyendo la ficha con Claude…') + '</h3><p>' + (sol.fotos || []).length + ' foto(s) · ' + esc(sol.cliente || 'sin nombre') + ' · enviada hace ' + hace(sol.created_at) + '</p><p>Suele tardar entre 30 y 60 segundos. Puedes cerrar y volver: la ficha queda en «Mis fichas».</p><button class="btn s" id="cancelar">Cancelar esta ficha</button></div>';
  } else if (sol.estado === 'leida') {
    var L = sol.lectura || {};
    h += cardCabecera(true);
    if (L.avisos && L.avisos.length) h += '<div class="msg warn"><b>Avisos de la lectura:</b> ' + L.avisos.map(esc).join(' · ') + '</div>';
    h += '<div class="card"><h2>Acabados <span>se aplican a todas las ventanas</span></h2>' +
      '<label>Vidrio' + ((S.cabTexto || {}).vidrio ? ' <span style="color:var(--muted)">(ficha: «' + esc(S.cabTexto.vidrio) + '»)</span>' : '') + '</label><select data-gen="vidrio" ' + (S.cat ? '' : 'disabled') + '>' + selVidrio(S.vidrio, false) + '</select>' +
      '<label>Color' + ((S.cabTexto || {}).color ? ' <span style="color:var(--muted)">(ficha: «' + esc(S.cabTexto.color) + '»)</span>' : '') + '</label><select data-gen="color" ' + (S.cat ? '' : 'disabled') + '>' + selColor(S.color, false) + '</select>' +
      '<div class="chk"><input type="checkbox" id="montaje" ' + (S.montaje ? 'checked' : '') + '><label for="montaje" style="margin:0;font-size:14px;color:var(--txt)">Añadir línea de montaje (el precio se pone en PrefGest)</label></div>' +
      (S.cat ? '' : '<div class="msg warn">Aún no tengo el catálogo de vidrios y colores del PC del taller: se usará el de la plantilla.</div>') + '</div>';
    h += '<div class="card"><h2>Ventanas <span>' + S.ventanas.length + ' · revisa medidas y tipo</span></h2>' + S.ventanas.map(cardVentana).join('') + '<button class="btn w" id="add">+ Añadir ventana</button></div>';
    barra.innerHTML = '<button class="btn p" id="crear" ' + (S.ventanas.length ? '' : 'disabled') + '>Crear presupuesto en PrefGest</button>'; barra.style.display = 'block';
  } else if (/^(crear|creando)$/.test(sol.estado)) {
    h += '<div class="card espera"><div class="sp"></div><h3>' + (sol.estado === 'crear' ? 'Esperando al PC del taller…' : 'Creando el presupuesto en PrefGest…') + '</h3><p>' + (sol.datos && sol.datos.ventanas ? sol.datos.ventanas.length : '?') + ' ventanas · ' + esc(sol.cliente || '') + '</p><p>PrefGest calcula los precios y se genera el PDF. Alrededor de un minuto.</p></div>';
  } else if (sol.estado === 'creado') {
    var R = sol.resultado || {};
    h += '<div class="card"><h2>Presupuesto ' + esc(R.numero) + '/' + esc(R.version) + ' <span>' + esc(R.cliente || '') + ' · ' + esc(R.tarifa || '') + '</span></h2><div class="total">' + fmt(R.importe) + ' €</div>' +
      (sol.pdf_url ? '<div class="g2"><a class="btn p" href="' + esc(sol.pdf_url) + '" target="_blank" rel="noopener">📄 Ver PDF</a><button class="btn" id="compartir">Compartir</button></div>' : '<div class="msg warn">No hay PDF subido (mira los avisos).</div>') +
      '<table><thead><tr><th>Pos.</th><th>Medidas</th><th class="n">Uds</th><th class="n">Importe</th></tr></thead><tbody>' + (R.posiciones || []).map(function (p) { return '<tr><td>' + (p.orden + 1) + '</td><td>' + esc(p.medidas || 'montaje') + '<br><small style="color:var(--muted)">' + esc(String(p.descripcion || '').slice(0, 90)) + '</small></td><td class="n">' + esc(p.uds) + '</td><td class="n">' + fmt(p.importe) + '</td></tr>'; }).join('') + '</tbody></table>' +
      (R.avisos && R.avisos.length ? '<div class="msg warn"><b>Revisar en PrefGest:</b><ul style="margin:4px 0 0 16px;padding:0">' + R.avisos.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="g2" style="margin-top:10px"><button class="btn" id="editar">Cambiar algo y crear otro</button><button class="btn" id="nueva">Nueva ficha</button></div></div>';
  } else if (sol.estado === 'error') {
    h += '<div class="card"><h2>No se ha podido</h2><div class="msg err">' + esc(sol.error || 'Error desconocido') + '</div><div class="g2" style="margin-top:10px"><button class="btn p" id="reintentar">Reintentar</button>' + (sol.lectura ? '<button class="btn" id="editar">Revisar las ventanas</button>' : '') + '</div><button class="btn w" id="nueva">Nueva ficha</button></div>';
  }
  app.innerHTML = h;
  eventos();
}
function cardVentana(v, i) {
  var baja = v.confianza && v.confianza !== 'alta';
  return '<div class="vent" data-i="' + i + '"><div class="h"><b>Ventana ' + (i + 1) + (v.estancia ? ' · ' + esc(v.estancia) : '') + '</b><button class="btn s d" data-del="' + i + '">Quitar</button></div>' +
    '<div class="g3"><div><label>Ancho (cm)</label><input inputmode="decimal" data-v="ancho_cm" value="' + esc(v.ancho_cm || '') + '"></div><div><label>Alto (cm)</label><input inputmode="decimal" data-v="alto_cm" value="' + esc(v.alto_cm || '') + '"></div><div><label>Uds</label><input inputmode="numeric" data-v="uds" value="' + esc(v.uds || 1) + '"></div></div>' +
    '<div class="g2"><div><label>Tipo</label><select data-v="tipo">' + opciones(Object.keys(TIPOS).map(function (k) { return [k, TIPOS[k]]; }), v.tipo) + '</select></div><div><label>Cajón</label><select data-v="cajon_cm">' + opciones(CAJONES, v.cajon_cm || 0) + '</select></div></div>' +
    '<div class="g2"><div><label>Persiana</label><select data-v="persiana">' + opciones(Object.keys(PERSIANA).map(function (k) { return [k, PERSIANA[k]]; }), v.persiana || 'ninguna') + '</select></div><div><label>Recogedor</label><select data-v="recogedor_lado">' + opciones(Object.keys(LADO).map(function (k) { return [k, LADO[k]]; }), v.recogedor_lado || 'ninguno') + '</select></div></div>' +
    (v.tipo === 'otro' || num(v.ancho_tramo1_cm) > 0 ? '<div class="g2"><div><label>Primer tramo L1 (cm)</label><input inputmode="decimal" data-v="ancho_tramo1_cm" value="' + esc(v.ancho_tramo1_cm || '') + '" placeholder="p. ej. 45"></div><div class="chk" style="margin-top:26px"><input type="checkbox" data-v="panel" id="pan' + i + '" ' + (v.panel ? 'checked' : '') + '><label for="pan' + i + '" style="margin:0;color:var(--txt);font-size:14px">Fijo de panel</label></div></div>' : '') +
    '<div class="g2"><div><label>Color</label><select data-v="color">' + selColor(v.color || '', true) + '</select></div><div><label>Vidrio</label><select data-v="vidrio">' + selVidrio(v.vidrio || '', true) + '</select></div></div>' +
    '<div class="chk"><input type="checkbox" data-v="tapajuntas" id="tj' + i + '" ' + (v.tapajuntas !== false ? 'checked' : '') + '><label for="tj' + i + '" style="margin:0;color:var(--txt);font-size:14px">Con tapajuntas</label></div>' +
    (v.notas || baja ? '<div class="nota">' + (baja ? '<span class="baja">Lectura dudosa (' + esc(v.confianza) + ')</span> · ' : '') + esc(v.notas || '') + '</div>' : '') + '</div>';
}
function eventos() {
  var app = $('app');
  var fi = $('foto-in'); if (fi) fi.onchange = function () { anadirFotos(fi.files); fi.value = ''; };
  app.querySelectorAll('[data-quitar]').forEach(function (el) { el.onclick = function () { S.fotos.splice(Number(el.dataset.quitar), 1); render(); }; });
  app.querySelectorAll('[data-cab]').forEach(function (el) { el.oninput = function () { S.cab[el.dataset.cab] = el.value; }; el.onchange = guardarBorrador; });
  app.querySelectorAll('[data-gen]').forEach(function (el) { el.onchange = function () { S[el.dataset.gen] = el.value; guardarBorrador(); render(); }; });
  var mon = $('montaje'); if (mon) mon.onchange = function () { S.montaje = mon.checked; guardarBorrador(); };
  app.querySelectorAll('[data-v]').forEach(function (el) {
    var i = Number(el.closest('.vent').dataset.i), f = el.dataset.v;
    el.onchange = function () {
      var v = S.ventanas[i]; if (!v) return;
      if (el.type === 'checkbox') v[f] = el.checked;
      else if (['ancho_cm', 'alto_cm', 'cajon_cm', 'ancho_tramo1_cm', 'uds'].indexOf(f) >= 0) v[f] = num(el.value);
      else v[f] = el.value;
      if (f === 'persiana' && v.persiana !== 'ninguna' && !num(v.cajon_cm)) v.cajon_cm = (num(v.alto_cm) + 15.5) <= 160 ? 15.5 : 18.5;
      if (f === 'persiana' && v.persiana === 'ninguna') { v.cajon_cm = 0; v.recogedor_lado = 'ninguno'; }
      guardarBorrador(); if (f === 'tipo' || f === 'persiana') render();
    };
  });
  app.querySelectorAll('[data-del]').forEach(function (el) { el.onclick = function () { if (confirm('¿Quitar la ventana ' + (Number(el.dataset.del) + 1) + '?')) { S.ventanas.splice(Number(el.dataset.del), 1); guardarBorrador(); render(); } }; });
  var b;
  if ((b = $('enviar'))) b.onclick = enviarALeer;
  if ((b = $('amano'))) b.onclick = empezarAMano;
  if ((b = $('add'))) b.onclick = function () { S.ventanas.push(ventanaNueva()); render(); setTimeout(function () { var v = app.querySelectorAll('.vent'); if (v.length) v[v.length - 1].scrollIntoView({ behavior: 'smooth' }); }, 50); };
  if ((b = $('crear'))) b.onclick = crearEnPrefGest;
  if ((b = $('cancelar'))) b.onclick = async function () { if (!confirm('¿Cancelar esta ficha?')) return; try { await sb('DELETE', 'pres_solicitudes?id=eq.' + S.sol.id, null, 'return=minimal'); } catch (e) {} nuevaFicha(); poll(); };
  if ((b = $('reintentar'))) b.onclick = reintentar;
  if ((b = $('editar'))) b.onclick = volverAEditar;
  if ((b = $('nueva'))) b.onclick = nuevaFicha;
  if ((b = $('compartir'))) b.onclick = function () {
    var R = S.sol.resultado || {}, txt = 'Presupuesto Jeovent ' + R.numero + ' · ' + fmt(R.importe) + ' €';
    if (navigator.share) navigator.share({ title: txt, text: txt, url: S.sol.pdf_url }).catch(function () {});
    else window.open('https://wa.me/?text=' + encodeURIComponent(txt + ' ' + S.sol.pdf_url), '_blank');
  };
}

/* ===== arranque ===== */
(function () {
  try { user = JSON.parse(localStorage.getItem('jeovent_user') || 'null'); } catch (e) {}
  if (!user || !user.username) { $('app').innerHTML = '<div class="card"><h2>Inicia sesión</h2><p style="color:var(--muted);font-size:14px">Entra primero en la app Jeovent y vuelve a esta pantalla.</p><a class="btn p w" href="app-mobile.html">Ir a iniciar sesión</a></div>'; return; }
  $('who').textContent = user.nombre || user.username;
  var actual = null; try { actual = localStorage.getItem(KEY_ACTUAL); } catch (e) {}
  render();
  if (actual) sb('GET', 'pres_solicitudes?id=eq.' + actual + '&select=*').then(function (r) { if (r && r[0] && r[0].estado !== 'creado') cargarSolicitud(r[0]); else { guardarActual(null); poll(); } }).catch(function () { poll(); });
  else poll();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(function () {});
})();
</script>
</body>
</html>
